name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # 在 Debian 10 容器内构建 (glibc 2.28)，与 UOS V20 一致
    # 避免使用已被 GitHub 移除的 ubuntu-20.04 runner
    container:
      image: python:3.8-slim-buster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # Debian 10 (buster) 已 EOL，apt 源需指向归档服务器
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org/debian-security|g' /etc/apt/sources.list 2>/dev/null || true
          cat /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev dpkg bash coreutils
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install PyQt5 PyInstaller

      - name: Build executable
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Debian package
        run: |
          ./build.sh --deb

      - name: List built files
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvas-build
          path: |
            dist/转录组DeNovo组装
            dist/TVAS_*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tvas-build

      - name: Verify files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TVAS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            转录组DeNovo组装
            TVAS_*.deb
